<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1> Aplikasi Notes</h1>

    <div class="form-card">
        <form id="noteForm">
            <input type="hidden" id="noteId">
            <input type="text" id="judul" placeholder="Masukkan Judul Catatan..." required>
            <textarea id="isi" rows="4" placeholder="Tulis isi catatan di sini..." required></textarea>
            <div>
                <button type="submit" class="btn-save" id="saveBtn">Simpan Catatan</button>
                <button type="button" class="btn-cancel" id="cancelBtn" onclick="resetForm()">Batal Edit</button>
            </div>
        </form>
    </div>

    <div class="notes-grid" id="notesContainer">
        </div>
</div>

<script src="script.js"></script>

</body>
</html>
